<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsilo · ask your data anything</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=5">
</head>
<body>
  <div class="orb orb1"></div><div class="orb orb2"></div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="/static/logo.svg" alt="" width="40" height="40">
        <span class="word">un<b>silo</b></span>
        <span class="muted tag">ask your data anything. with receipts.</span>
      </div>
      <div class="status" id="status"></div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="ask" class="on">Ask</button>
      <button data-tab="sources">Sources</button>
      <button data-tab="gmail">Gmail</button>
      <button data-tab="drive">Drive</button>
      <button data-tab="whatsapp">WhatsApp</button>
      <button data-tab="outputs">Outputs</button>
    </nav>

    <main>
      <section data-view="ask">
        <form class="askbox" id="askForm">
          <input id="q" placeholder="Ask anything across WhatsApp, Gmail and Drive…" autocomplete="off" aria-label="Question">
          <button class="btn primary" id="askBtn">Ask</button>
        </form>
        <div class="chips" id="examples"></div>
        <div id="answer"></div>
        <div id="setup"></div>
      </section>
      <section data-view="sources" hidden><div id="sources"></div></section>
      <section data-view="gmail" hidden><div id="gmail"></div></section>
      <section data-view="drive" hidden><div id="drive"></div></section>
      <section data-view="whatsapp" hidden><div id="whatsapp"></div></section>
      <section data-view="outputs" hidden>
        <div class="row">
          <button class="chip" data-out="whatsapp">whatsapp_output.json</button>
          <button class="chip" data-out="gmail">gmail_output.json</button>
          <button class="chip" data-out="drive">drive_output.json</button>
          <span class="grow"></span>
          <button class="btn primary" id="exportBtn">Write outputs/ files</button>
        </div>
        <pre class="card json" id="json" hidden></pre>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
